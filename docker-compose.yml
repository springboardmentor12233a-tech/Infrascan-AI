version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: infrascan-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./infrascan.db
      - SECRET_KEY=infrascan-super-secret-key-production-ready
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - UPLOAD_PATH=./uploads
    volumes:
      - backend-data:/app/backend/uploads
      - backend-reports:/app/backend/reports
      - backend-db:/app/backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: infrascan-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  backend-reports:
  backend-db:
